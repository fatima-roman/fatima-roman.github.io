<html>
  <header>
    <meta charset="UTF-8">
    <meta name="keywords" content="HTML, CSS, JavaScript">

    <h1>CodeFest 2025</h1>
    <h2>Donde la Música y el Código se encuentran</h2>
  </header>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="cartel.html">Cartel</a></li>
        <li><a href="localizacion.html">Localización</a></li>
      </ul>

    <br><br>
    <main>
      <form action="https://www.w3schools.com/action_page.php">
        <fieldset>
            <legend>Datos personales</legend>
            <label for="Nombre">Nombre y Aplellidos:</label><br>
            <input rows="10" cols="50" placeholder="Nombre y Apellidos" id="Nombre" name="Nombre" ><br><br>
            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" name="correo" placeholder="Correo Electrónico" id="correo" name="correo"><br><br>
        </fieldset>
        <fieldset>
            <legend>Tipo de entrada</legend>
            <input type="radio" name="tipo_entrada" value="Abono General (3 Días)">
            <label for="Abono General (3 Días)">Abono General (3 Días)</label><br>
            <input type="radio" name="tipo_entrada" value="Abono VIP (3 Días)">
            <label for="Abono VIP (3 Días)">Abono VIP (3 Días)</label><br>
            <input type="radio" name="tipo_entrada" value="Entrada de día">
            <label for="Entrada de día">Entrada de día</label><br>
        </fieldset>
        <fieldset>
            <legend>Extras</legend>
            <input type="checkbox" id="camping" name="camping" value="Camping">
            <label for="camping">Camping</label><br>
            <input type="checkbox" id="merchandising" name="merchandising" value="Merchandising">
            <label for="merchandising">Pack Merchandising</label><br>
            <input type="checkbox" id="Talleres" name="talleres" value="Talleres">
            <label for="talleres">Acceso a Talleres Tech</label><br>
        </fieldset>
        <fieldset>
            <legend>Día (Solo si es Entrada de Día)</legend>
            <select>
                <option value="viernes">Viernes</option>
                <option value="sabado">Sábado</option>
                <option value="domingo">Domingo</option>
            </select>

        </fieldset>
        <button type="submit" value="Enviar">ENVIAR</button>
      </form>
    </main>
