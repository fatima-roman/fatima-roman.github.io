<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 reto</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="../CSS/footer_volver.css">
</head>
<body>
    <h1>Ejercicio 2 reto</h1>
    <form id="input">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellidos" placeholder="Apellidos">
        <input type="number" id="edad" placeholder="Edad">
        <input type="text" id="ciudad" placeholder="Ciudad">
        <button type="button" onclick="convertirObjetoAJSON()">Convertir a JSON</button>
        <button type="button" onclick="convertirJSONAObjeto()">Convertir a JS</button>
    </form>

    <div id="resultado"></div>

    <div id="tablaysuma">
        <table id="tabla">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Edad</th>
                    <th>Ciudad</th>
                </tr>
            </thead>
            <tbody id="tbody-datos"></tbody>
        </table>
        <div id="extra"></div>
    </div>

    <footer>
        <p><a href="../index.html">Volver al inicio</a></p>
    </footer>

    <script>
        // Variables globales
        let jsonGuardado = "";
        let listaEdades  = [];

        function comprobarCampos() {
            if ($("#nombre").val()    === "") { alert("El campo nombre es obligatorio");    return false; }
            if ($("#apellidos").val() === "") { alert("El campo apellidos es obligatorio"); return false; }
            if ($("#edad").val()      === "") { alert("El campo edad es obligatorio");      return false; }
            if ($("#ciudad").val()    === "") { alert("El campo ciudad es obligatorio");    return false; }
            return true;
        }

        function serializar(obj)       { return JSON.stringify(obj); }
        function deserializar(jsonStr) { return JSON.parse(jsonStr); }

        function enviar(obj) {
            console.log("Serializado:", obj.nombre);
            return serializar(obj);
        }
        function recibir(jsonStr) {
            console.log("Deserializado:", jsonStr);
            return deserializar(jsonStr);
        }

        // Boton 1: recoge formulario y guarda JSON en variable global
        function convertirObjetoAJSON() {
            if (!comprobarCampos()) return;
            const objeto = {
                nombre:    $("#nombre").val(),
                apellidos: $("#apellidos").val(),
                edad:      parseInt($("#edad").val(), 10),
                ciudad:    $("#ciudad").val()
            };
            jsonGuardado = enviar(objeto);
            $("#resultado").text(jsonGuardado);
        }

        // Boton 2: deserializa desde la variable global (NUNCA del DOM)
        function convertirJSONAObjeto() {
            if (jsonGuardado === "") {
                alert("Primero convierte a JSON");
                return;
            }
            const obj = recibir(jsonGuardado);
            jsonGuardado = "";
            $("#resultado").text(
                "Nombre: " + obj.nombre + ", Apellidos: " + obj.apellidos +
                ", Edad: " + obj.edad + ", Ciudad: " + obj.ciudad
            );
            aniadirTabla(obj);
        }

        function generaTr(obj) {
            return "<tr>" +
                "<td>" + obj.nombre    + "</td>" +
                "<td>" + obj.apellidos + "</td>" +
                "<td>" + obj.edad      + "</td>" +
                "<td>" + obj.ciudad    + "</td>" +
                "</tr>";
        }

        function aniadirTabla(obj) {
            $("#tbody-datos").append(generaTr(obj));
            listaEdades.push(obj.edad);
            calcularEstadisticas();
        }

        function calcularEstadisticas() {
            if (listaEdades.length === 0) {
                $("#extra").html("Sin datos");
                return;
            }
            const suma   = listaEdades.reduce(function(acc, e) { return acc + e; }, 0);
            const media  = suma / listaEdades.length;
            const maximo = Math.max.apply(null, listaEdades);
            const minimo = Math.min.apply(null, listaEdades);
            $("#extra").html(
                "Suma = "    + suma             + "<br>" +
                "Media = "   + media.toFixed(2) + "<br>" +
                "Maximo = "  + maximo           + "<br>" +
                "Minimo = "  + minimo
            );
        }
    </script>

    <style>
        h1 { text-align: center; }
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: rgb(173, 159, 173);
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(88, 71, 104);
            margin: 0 20%;
            border-radius: 20px;
            padding: 10px;
        }
        #resultado {
            display: flex;
            justify-content: center;
            margin: 20px 15% 0;
            padding: 10px;
            background-color: rgb(199, 186, 211);
            border: 3px solid rgb(88, 71, 104);
            border-radius: 20px;
        }
        input {
            border-radius: 30px;
            padding: 10px;
            margin: 3px;
            background-color: rgb(199, 186, 211);
        }
        button {
            border-radius: 30px;
            padding: 10px;
            margin: 3px;
            background-color: rgb(199, 186, 211);
            border: 3px solid rgb(63, 51, 75);
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(63, 51, 75);
            color: white;
        }
        #tablaysuma {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: rgb(88, 71, 104);
            margin: 20px 10% 0;
            border-radius: 20px;
            padding: 20px;
        }
        table { border-collapse: collapse; width: auto; }
        th, td {
            border: 1px solid rgb(63, 51, 75);
            padding: 8px;
            text-align: left;
        }
        thead { background-color: rgb(88, 71, 104); color: white; }
        #extra {
            background-color: rgb(199, 186, 211);
            padding: 10px;
            border: 3px solid rgb(88, 71, 104);
            border-radius: 10px;
            min-width: 150px;
            text-align: center;
        }
    </style>
</body>
</html>
