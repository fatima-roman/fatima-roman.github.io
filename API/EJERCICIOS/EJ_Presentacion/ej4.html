<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="..\CSS\footer_volver.css">
</head>
<body>
    <h1>Ejercicio 4</h1>
    <form id="input">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellidos" placeholder="Apellidos">
        <input type="number" id="edad" placeholder="Edad">
        <input type="text" id="ciudad" placeholder="Ciudad">
        
        <div id="grupo-hobbies">
            <label><input type="checkbox" class="hobbie" value="Deporte"> Deporte</label>
            <label><input type="checkbox" class="hobbie" value="Lectura"> Lectura</label>
            <label><input type="checkbox" class="hobbie" value="Música"> Música</label>
            <label><input type="checkbox" class="hobbie" value="Juegos"> Juegos</label>
            <label><input type="checkbox" class="hobbie" value="Cine"> Cine</label>
            <label><input type="checkbox" class="hobbie" value="Teatro"> Teatro</label>
            <label><input type="checkbox" class="hobbie" value="Coleccionismo"> Coleccionismo</label>
            <label><input type="checkbox" class="hobbie" value="Bricolaje"> Bricolaje</label>
            <label><input type="checkbox" class="hobbie" value="Cosplay"> Cosplay</label>
        </div>
        <button type="button" onclick="recogerDatos()">Enviar</button> 
    </form>

    <div id="resultado"></div>
    <div id="tablaysuma">
        <table id="tabla">
            <thead>
                <tr>
                    <th id="th-nombre">Nombre</th>
                    <th id="th-apellidos">Apellidos</th>
                    <th id="th-edad">Edad</th>
                    <th id="th-ciudad">Ciudad</th>
                    <th id="th-hobbies">Hobbies</th>
                </tr>
            </thead>
            <tbody id="tbody-datos">
            </tbody>
        </table>
        <div id="extra"></div>
    </div>
    <footer>
        <p><a href="../index.html">Volver al inicio</a></p>
    </footer>

    <script>
    let datos = [];

    function comprobarCampos() {
        if ($("#nombre").val() === "") {
            alert("El campo nombre es obligatorio");
            return false;
        }
        if ($("#apellidos").val() === "") {
            alert("El campo apellidos es obligatorio");
            return false;
        }
        if ($("#edad").val() === "") {
            alert("El campo edad es obligatorio");
            return false;
        }
        if ($("#ciudad").val() === "") {
            alert("El campo ciudad es obligatorio");
            return false;
        }
        return true;
    }

    function recogerDatos() {        
        if (!comprobarCampos()) return;

        let nuevoUsuario = {
            nombre: $("#nombre").val().trim(),
            apellidos: $("#apellidos").val().trim(),
            edad: parseInt($("#edad").val()),
            ciudad: $("#ciudad").val().trim(),
            hobbies: $('.hobbie:checked')
                .map(function () {
                    return $(this).val();
                }).get()
        };

        datos.push(nuevoUsuario);
        envio();

        // ✅ CAMBIO 1: Limpiar el formulario tras enviar.
        // Antes los campos quedaban con los valores escritos, lo que
        // obligaba al usuario a borrarlos manualmente antes del siguiente envío.
        $("#nombre, #apellidos, #edad, #ciudad").val("");
        $(".hobbie").prop("checked", false).prop("disabled", false);
    }

    function generarFila(usuario, posicion) {
        let tbody = $("#tbody-datos");
        let fila = $(`
            <tr id="fila_${posicion}">
                <td>${usuario.nombre}</td>
                <td>${usuario.apellidos}</td>
                <td>${usuario.edad}</td>
                <td>${usuario.ciudad}</td>
                <td>${usuario.hobbies}</td>
            </tr>
        `);

        fila.on("click", function () {
            eliminarFila(posicion);
        });

        tbody.append(fila);
    }

    function pintarEstadisticas(calculo) {
        $("#extra").html(
            `Suma = ${calculo.suma} <br> Media = ${calculo.media.toFixed(2)} <br> Máximo = ${calculo.max} <br> Mínimo = ${calculo.min}`
        );
    }

    // ✅ CAMBIO 2: Simplificar eliminarFila, eliminando la reconstrucción manual de la tabla.
    // Antes, esta función reconstruía toda la tabla con datos.forEach() Y luego llamaba
    // a envio(), cuyo .done() ejecutaba generarFila() una vez más, duplicando la última fila.
    // Ahora la función solo actualiza el array y delega el repintado completamente a envio().
    function eliminarFila(posicion) {
        datos.splice(posicion, 1);

        if (datos.length > 0) {
            envio();
        } else {
            // Si no quedan datos, limpiar tabla y estadísticas manualmente
            // porque no hay nada que enviar al servidor
            $("#tbody-datos").empty();
            $("#extra").html("Sin datos");
        }
    }

    // ✅ CAMBIO 3: envio() es ahora el único responsable de repintar la tabla entera.
    // Antes solo añadía la última fila con generarFila(), lo que causaba duplicados
    // al llamarse desde eliminarFila() (que ya había reconstruido la tabla antes).
    // Ahora vacía el tbody y recorre response.lista completa para repintarlo desde cero,
    // garantizando que la tabla siempre refleja exactamente lo que devuelve el servidor.
    // ✅ CAMBIO 4: Eliminada la llamada a solicitud() dentro de .done().
    // El POST ya devuelve response.calculos con las estadísticas actualizadas,
    // por lo que hacer un GET adicional era redundante y pintaba los datos dos veces.
    function envio() {
        $.ajax({
            url: "https://lm.iesnervion.es/eco.php",
            method: "POST",
            data: JSON.stringify(datos),
            dataType: "json"
        })
        .done(function(response) {
            let tbody = $("#tbody-datos");
            tbody.empty(); // Limpiar antes de repintar
            response.lista.forEach((usuario, index) => {
                generarFila(usuario, index);
            });
            pintarEstadisticas(response.calculos);
            console.log(response);
        })
        .fail(function(error) {
            console.log(error);
        });
    }

    // solicitud() queda disponible por si se necesita en el futuro,
    // pero ya no se llama automáticamente desde envio()
    function solicitud() { 
        $.ajax({ 
            url: "https://lm.iesnervion.es/eco.php", 
            method: "GET", 
            dataType: "json"
        })
        .done(function(response) {
            console.log(response);
            pintarEstadisticas(response.calculos);
        })
        .fail(function(error) {
            console.log(error);
        });
    }

    // Límite de 3 hobbies marcados
    $(document).ready(function () {
        $(".hobbie").on("change", function () {
            let marcados = $(".hobbie:checked").length;

            if (marcados >= 3) {
                $(".hobbie:not(:checked)").prop("disabled", true);
            } else {
                $(".hobbie").prop("disabled", false);
            }
        });
    });
    </script>

    <style>
        h1 {
            text-align: center;
        }
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: rgb(173, 159, 173);
        }
        form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgb(88, 71, 104);
            margin-left: 20%;
            margin-right: 20%;
            border-radius: 20px;
            padding: 10px;
        }
        #resultado {
            display: flex;
            justify-content: center;              
            margin-top: 20px;
            background-color: rgb(199, 186, 211);
            padding: 10px;
            border: 3px solid rgb(88, 71, 104);
            border-radius: 20px;
            margin-left: 15%;
            margin-right: 15%;
        }
        input {
            border-radius: 30px;
            padding: 10px;
            margin: 3px;
            background-color: rgb(199, 186, 211);
        }
        button {
            border-radius: 30px;
            padding: 10px;
            margin: 3px;
            background-color: rgb(199, 186, 211);
            border: 3px solid rgb(63, 51, 75);
        }
        button:hover {
            background-color: rgb(63, 51, 75);
            color: white;
        }
        #tablaysuma {
            display: flex;
            justify-content: center;             
            align-items: center;                
            flex-direction: row;
            gap: 20px;                          
            background-color: rgb(88, 71, 104);
            margin-left: 10%;
            margin-right: 10%;
            margin-top: 20px;
            border-radius: 20px;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: auto;                        
            margin: 0;                          
        }
        th, td {
            border: 1px solid rgb(63, 51, 75);
            padding: 8px;
            text-align: left;
        }
        thead {
            background-color: rgb(88, 71, 104);
            color: white;
        }
        tbody {
            color: rgb(233, 226, 226);
        }
        tbody tr:hover {
            background-color: rgb(199, 186, 211);
            color: black;
            cursor: pointer;
        }
        #extra {
            background-color: rgb(199, 186, 211);
            padding: 10px;
            border: 3px solid rgb(88, 71, 104);
            border-radius: 10px;
            margin: 0;                           
            min-width: 150px;
            text-align: center;                 
        }
        #grupo-hobbies {
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 15%;
            margin-right: 15%;
            background-color: rgb(199, 186, 211);
            border-radius: 15px;
            padding: 8px 12px;
            border: 2px solid rgb(43, 34, 51);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        #grupo-hobbies label {
            color: rgb(255, 255, 255);
            font-size: 0.9rem;
            background-color: rgb(88, 71, 104);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #grupo-hobbies input[type="checkbox"] {
            width: auto;
            height: auto;
            margin: 0;
            accent-color: rgb(63, 51, 75);
            border-radius: 4px;
        }
    </style>
</body>
</html>
